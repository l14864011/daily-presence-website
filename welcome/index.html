<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WSGQ24JQ9S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WSGQ24JQ9S');
  </script>

  <title>You're in — Presence</title>
  <meta name="description" content="Your subscription is confirmed. A short mindfulness practice arrives every Sunday.">
  <link rel="canonical" href="https://dailypresence.life/welcome/">
  <link rel="icon" type="image/png" href="../favicon.png">
  <meta name="theme-color" content="#3A5532">
  <!-- A private thank-you page, not something to surface in search. -->
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --green:  #3A5532;
      --green-d:#2A3F24;
      --sage:   #7A9270;
      --cream:  #FAF7F3;
      --text:   #2C2C28;
      --muted:  #7A7A70;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
    }
    img { display: block; max-width: 100%; }

    /* ── NAV — same treatment as the home page, over the image ── */
    nav {
      position: absolute; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
    }
    .logo {
      display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
      text-decoration: none; line-height: 1;
    }
    .logo img { width: 34px; height: auto; object-fit: contain; }
    .logo span {
      font-family: 'Playfair Display', serif;
      font-style: italic; font-size: 19px; font-weight: 500;
      color: #fff; letter-spacing: 0.3px;
    }
    .nav-link {
      font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.85);
      text-decoration: none; transition: color 0.3s;
    }
    .nav-link:hover, .nav-link:focus-visible { color: #fff; }

    /* ── HERO — the home page hero, carrying a different message ── */
    .hero {
      position: relative;
      min-height: 100vh; min-height: 100svh;
      width: 100vw;
      overflow: hidden;
      display: flex; align-items: flex-end;
    }
    .hero-slides { position: absolute; inset: 0; z-index: 0; }
    .hero-slide {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center;
      opacity: 0; transform: scale(1.06);
      transition: opacity 1.6s ease, transform 7s ease;
    }
    .hero-slide.active { opacity: 1; transform: scale(1); }
    .hero-scrim {
      position: absolute; inset: 0; z-index: 1;
      background:
        linear-gradient(90deg, rgba(28,38,26,0.62) 0%, rgba(28,38,26,0.32) 38%, rgba(28,38,26,0.04) 66%, transparent 100%),
        linear-gradient(0deg, rgba(28,38,26,0.55) 0%, rgba(28,38,26,0.06) 32%, transparent 55%);
    }
    .hero-inner {
      position: relative; z-index: 2;
      width: 100%; max-width: 1240px; margin: 0 auto;
      padding: 0 48px 9vh;
    }
    .hero-copy { max-width: 620px; }
    .hero-eyebrow {
      font-size: 12px; font-weight: 500; letter-spacing: 3px;
      text-transform: uppercase; color: rgba(255,255,255,0.82);
      margin-bottom: 22px;
      opacity: 0; transform: translateY(16px);
      animation: rise 1s ease 0.2s forwards;
    }
    .hero-title {
      font-family: 'Playfair Display', serif; font-style: italic; font-weight: 500;
      font-size: clamp(46px, 7vw, 92px); line-height: 1.02;
      color: #fff; margin: 0 0 24px; letter-spacing: -0.5px;
      text-shadow: 0 2px 30px rgba(0,0,0,0.25);
      opacity: 0; transform: translateY(20px);
      animation: rise 1.1s ease 0.35s forwards;
    }
    .hero-sub {
      font-size: clamp(16px, 1.5vw, 19px); font-weight: 300; line-height: 1.8;
      color: rgba(255,255,255,0.92); margin: 0 0 14px; max-width: 540px;
      opacity: 0; transform: translateY(20px);
      animation: rise 1.1s ease 0.5s forwards;
    }
    .hero-sub.last { margin-bottom: 0; animation-delay: 0.65s; }
    .hero-sub em {
      font-family: 'Playfair Display', serif; font-style: italic;
      font-size: 1.12em; color: #fff;
    }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .hero-caption {
      position: absolute; z-index: 2; right: 48px; bottom: 9vh;
      display: flex; align-items: center; gap: 9px;
      padding: 8px 16px; border-radius: 100px;
      background: rgba(255,255,255,0.16);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 13px; color: #fff; letter-spacing: 0.4px;
    }
    .hero-caption .dot-live { width: 6px; height: 6px; border-radius: 50%; background: #C7DFB8; }

    @media (max-width: 760px) {
      nav { padding: 18px 24px; }
      .hero-inner { padding: 0 24px 8vh; }
      .hero-caption { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .hero-slide.active { opacity: 1; transform: none; }
      .hero-eyebrow, .hero-title, .hero-sub { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/"><img src="../assets/logo-mark.png" alt=""><span>Presence</span></a>
  <a class="nav-link" href="/">Back to Presence</a>
</nav>

<section class="hero">
  <div class="hero-slides">
    <img class="hero-slide active" src="../assets/moment-coffee.jpg"  alt="A quiet moment with morning coffee" fetchpriority="high" style="object-position: 82% center">
    <img class="hero-slide" src="../assets/moment-kids.jpg"    alt="Time with the kids"   style="object-position: 72% center">
    <img class="hero-slide" src="../assets/moment-friends.jpg" alt="Sitting with friends" style="object-position: 50% center">
    <img class="hero-slide" src="../assets/moment-tennis.jpg"  alt="Playing tennis"       style="object-position: 60% center">
    <img class="hero-slide" src="../assets/moment-dog.jpg"     alt="Walking the dog"      style="object-position: 70% center">
  </div>
  <div class="hero-scrim"></div>

  <div class="hero-inner">
    <div class="hero-copy">
      <p class="hero-eyebrow">Mindful daily life</p>
      <h1 class="hero-title">You're in.</h1>
      <p class="hero-sub">
        Thank you so much for subscribing — a weekly mindfulness practice is on its way.
      </p>
      <p class="hero-sub last">
        And more importantly, thank <em>yourself</em>. You took the step to come back
        to yourself, to be present. That is a beautiful thing.
      </p>
    </div>
  </div>

  <div class="hero-caption">
    <span class="dot-live"></span>
    <span id="caption-text">Morning coffee</span>
  </div>
</section>

<script>
  /* ── Hero slideshow (cross-fade) — same cadence as the home page ── */
  var slides = Array.from(document.querySelectorAll('.hero-slide'));
  var captions = ['Morning coffee', 'With the kids', 'With friends', 'Playing tennis', 'Walking the dog'];
  var captionEl = document.getElementById('caption-text');
  var si = 0;
  setInterval(function () {
    slides[si].classList.remove('active');
    si = (si + 1) % slides.length;
    slides[si].classList.add('active');
    if (captionEl) captionEl.textContent = captions[si];
  }, 4200);
</script>
</body>
</html>
